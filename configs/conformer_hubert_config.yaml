# Conformer + HuBERT — Phase 4 정확도 개선
# HuBERT-Large 1024-dim features, Medium 사이즈 (VRAM 안전)
# v8 loss 개선 적용: pcc_weight 0.3, fp32

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: hubert          # HuBERT-Large 1024-dim
  parameter_type: geometric
  sequence_length: 500
  streaming: true

training:
  batch_size: 32                   # fp32 + 1024-dim input → VRAM 안전
  num_epochs: 150
  num_workers: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "32-true"             # NaN 방지

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.0001            # 안정적 수렴
  weight_decay: 0.01
  betas: [0.9, 0.98]

# Model — Conformer Medium + HuBERT input
model:
  name: ConformerHuBERT
  input_dim: 1024                  # HuBERT-Large output dim
  d_model: 512                     # Medium 사이즈 (Large → Medium, VRAM 절약)
  num_layers: 12
  num_heads: 8
  d_ff: 2048
  depthwise_conv_kernel_size: 31
  output_dim: 14                   # 14 Geometric features
  dropout: 0.1
  learning_rate: 0.0001
  weight_decay: 0.01
  mse_weight: 1.0                  # v8 개선: MSE 비중 높임
  pcc_weight: 0.3                  # v8 개선: 2.0 → 0.3 (loss 지배 방지)
  velocity_weight: 0.2             # v8 개선: 1.2 → 0.2
  acceleration_weight: 0.1         # v8 개선: 0.5 → 0.1

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 25
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "conformer-hubert-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: conformer_hubert_phase4
  log_dir: logs/training
  save_dir: models/conformer_hubert
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 10

# Reproducibility
seed: 42

# Hardware
device: cuda
