# Conformer Medium + HuBERT — Phase 4 중간 사이즈 실험
# Small(6.3M, PCC 0.121) vs Large(73M, PCC 0.105) 사이 최적점 탐색
# d_model=384, 8L, dropout=0.2 → 예상 ~20M params

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: hubert
  parameter_type: geometric
  sequence_length: 500
  streaming: true

training:
  batch_size: 32
  num_epochs: 200
  num_workers: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "32-true"

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.0002
  weight_decay: 0.05                # small(0.1)과 large(0.01) 사이
  betas: [0.9, 0.98]

# Model — Conformer Medium-Small + HuBERT input
model:
  name: ConformerHuBERT
  input_dim: 1024
  d_model: 384                     # 256(small) → 384 → 512(medium)
  num_layers: 8                    # 6(small) → 8 → 12(medium)
  num_heads: 6                     # 4(small) → 6 → 8(medium)
  d_ff: 1024                       # 512(small) → 1024 → 2048(medium)
  depthwise_conv_kernel_size: 31
  output_dim: 14
  dropout: 0.2                     # 0.3(small) → 0.2 → 0.1(medium)
  learning_rate: 0.0002
  weight_decay: 0.05
  mse_weight: 1.0
  pcc_weight: 0.3
  velocity_weight: 0.2
  acceleration_weight: 0.1

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 30
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "conformer-hubert-med-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: conformer_hubert_medium_phase4
  log_dir: logs/training
  save_dir: models/conformer_hubert_medium
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 10

# Reproducibility
seed: 42

# Hardware
device: cuda
