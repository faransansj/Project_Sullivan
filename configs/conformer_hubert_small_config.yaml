# Conformer Small + HuBERT — Phase 4 오버피팅 대응
# 73.4M → ~8M params로 축소, dropout/weight_decay 강화
# 실험 근거: HuBERT v2(73.4M)에서 val_PCC 0.161 → test_PCC 0.105 오버피팅 확인

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: hubert          # HuBERT-Large 1024-dim
  parameter_type: geometric
  sequence_length: 500
  streaming: true

training:
  batch_size: 32
  num_epochs: 200                  # 작은 모델은 수렴 빠르지만 여유있게
  num_workers: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "32-true"

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.0003            # 작은 모델은 lr 약간 높여도 안정
  weight_decay: 0.1                # 0.01 → 0.1 (강한 L2 정규화)
  betas: [0.9, 0.98]

# Model — Conformer Small + HuBERT input
model:
  name: ConformerHuBERT
  input_dim: 1024                  # HuBERT-Large output dim
  d_model: 256                     # 512 → 256 (파라미터 1/4)
  num_layers: 6                    # 12 → 6
  num_heads: 4                     # 8 → 4
  d_ff: 512                        # 2048 → 512
  depthwise_conv_kernel_size: 31
  output_dim: 14                   # 14 Geometric features
  dropout: 0.3                     # 0.1 → 0.3 (강한 dropout)
  learning_rate: 0.0003
  weight_decay: 0.1
  mse_weight: 1.0
  pcc_weight: 0.3
  velocity_weight: 0.2
  acceleration_weight: 0.1

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 30
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "conformer-hubert-small-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: conformer_hubert_small_phase4
  log_dir: logs/training
  save_dir: models/conformer_hubert_small
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 10

# Reproducibility
seed: 42

# Hardware
device: cuda
