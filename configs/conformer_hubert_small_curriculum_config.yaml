# Conformer Small + HuBERT + Curriculum Loss — Phase 4
# 기반: Small v1 (test_PCC 0.1212)
# Curriculum: epoch 0-29 MSE only → epoch 30-59 PCC/vel/acc 선형 증가 → epoch 60+ 전체 loss
#
# 근거:
#   - 초기 학습 불안정의 주원인은 PCC loss가 예측값이 random할 때 너무 큰 gradient 발생
#   - MSE로 먼저 기저 궤적을 학습한 뒤 PCC로 상관관계 최적화
#   - val_loss가 동일 curriculum으로 계산되어 early stopping 공정성 유지

# Data
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: hubert
  parameter_type: geometric
  sequence_length: 500
  streaming: true

training:
  batch_size: 32
  num_epochs: 300
  num_workers: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "32-true"

# Optimization — Small v1과 동일
optimization:
  optimizer: AdamW
  learning_rate: 0.0003
  weight_decay: 0.1
  betas: [0.9, 0.98]

# No augmentation (aug 실험에서 HuBERT에 부적합 확인)
augmentation:
  enabled: false

# Model — Small v1과 동일 구조, curriculum 파라미터 추가
model:
  name: ConformerHuBERT
  input_dim: 1024
  d_model: 256
  num_layers: 6
  num_heads: 4
  d_ff: 512
  depthwise_conv_kernel_size: 31
  output_dim: 14
  dropout: 0.3
  learning_rate: 0.0003
  weight_decay: 0.1
  mse_weight: 1.0
  pcc_weight: 0.3
  velocity_weight: 0.2
  acceleration_weight: 0.1
  # Curriculum scheduling
  curriculum_warmup_epochs: 30   # epoch 0-29: MSE loss만 사용
  curriculum_ramp_epochs: 30     # epoch 30-59: PCC/vel/acc 선형 0→1 증가

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 50
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "conformer-hubert-small-curriculum-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: conformer_hubert_small_curriculum_phase4
  log_dir: logs/training
  save_dir: models/conformer_hubert_small_curriculum
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 10

# Reproducibility
seed: 42

# Hardware
device: cuda
