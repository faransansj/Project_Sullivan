# Conformer Small v2 + HuBERT — 정규화 강화 튜닝
# 기반: Small v1 (test_PCC 0.121, val_PCC peak 0.161)
# 목표: val→test gap(0.04) 축소, test_PCC > 0.15
# 변경: dropout 0.3→0.4, weight_decay 0.1→0.15, lr 0.0003→0.0002

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: hubert
  parameter_type: geometric
  sequence_length: 500
  streaming: true

training:
  batch_size: 32
  num_epochs: 300                  # 정규화 강해지면 수렴 느려짐
  num_workers: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "32-true"

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.0002            # 0.0003 → 0.0002 (안정적 수렴)
  weight_decay: 0.15               # 0.1 → 0.15 (L2 강화)
  betas: [0.9, 0.98]

# Model — Conformer Small v2
model:
  name: ConformerHuBERT
  input_dim: 1024
  d_model: 256
  num_layers: 6
  num_heads: 4
  d_ff: 512
  depthwise_conv_kernel_size: 31
  output_dim: 14
  dropout: 0.4                     # 0.3 → 0.4 (dropout 강화)
  learning_rate: 0.0002
  weight_decay: 0.15
  mse_weight: 1.0
  pcc_weight: 0.3
  velocity_weight: 0.2
  acceleration_weight: 0.1

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 40                   # 정규화 강해지면 수렴 느림 → patience 늘림
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "conformer-hubert-small-v2-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: conformer_hubert_small_v2_phase4
  log_dir: logs/training
  save_dir: models/conformer_hubert_small_v2
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 10

# Reproducibility
seed: 42

# Hardware
device: cuda
