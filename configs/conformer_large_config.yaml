# Conformer Large — A100 80GB Full Utilization Config
# Architecture scaled to ~60-65GB VRAM target
# Medium baseline: d_model=512, 12L, batch=32 → ~11GB
# Large target:    d_model=1024, 18L, batch=64 → ~60-65GB

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: mel          # 'mel' or 'hubert'
  parameter_type: geometric
  sequence_length: 500
  streaming: true

training:
  batch_size: 64                   # 4x medium → major VRAM consumer
  num_epochs: 200                  # large 모델은 수렴 느림 — 충분히 확보
  num_workers: 8
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: "16-mixed"            # FP16 mixed precision (필수 — 없으면 OOM)

# Optimization — larger model needs lower LR with warmup
optimization:
  optimizer: AdamW
  learning_rate: 0.0002            # medium(0.0005)보다 낮게 — 모델 크기 보정
  weight_decay: 0.01
  betas: [0.9, 0.98]

# Model — Conformer Large
model:
  name: ConformerLarge
  input_dim: 80                    # Mel-spectrogram
  d_model: 1024                    # 2x medium
  num_layers: 18                   # 1.5x medium
  num_heads: 16                    # 2x medium
  d_ff: 4096                       # 2x medium
  depthwise_conv_kernel_size: 31
  output_dim: 14                   # 14 Geometric features
  dropout: 0.1
  learning_rate: 0.0002
  weight_decay: 0.01
  mse_weight: 0.8
  pcc_weight: 2.0
  velocity_weight: 1.2
  acceleration_weight: 0.5

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 40                   # medium(20)보다 2배 — pcc_loss 수렴 느림
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3
    save_last: true
    filename: "conformer-large-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: conformer_large_phase4
  log_dir: logs/training
  save_dir: models/conformer_large
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 10

# Reproducibility
seed: 42

# Hardware
device: cuda
