# Transformer A100 Hyper-Performance Configuration
# Optimized for NVIDIA A100 (80GB) with HuBERT-ready dimensions

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: hubert  # Ready for HuBERT upgrade!
  parameter_type: joint       # Combined Geometric + PCA
  sequence_length: 500
  streaming: true

training:
  batch_size: 256             # Scaled for A100
  num_epochs: 100             # Deep training
  num_workers: 16             # High-speed IO
  accumulate_grad_batches: 1  # No need for accumulation with 256 batch
  gradient_clip_val: 0.5      # Stable training
  precision: "bf16-mixed"     # A100 native acceleration

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.001        # Higher LR for larger batches
  weight_decay: 0.05          # Stronger regularization for bigger model
  betas: [0.9, 0.98]
  lr_scheduler: CosineAnnealingWarmRestarts
  lr_scheduler_params:
    T_0: 20
    T_mult: 2
    eta_min: 0.000001

# Model parameters (Large Scale)
model:
  name: Transformer-A100-Master
  input_dim: 1024             # Match HuBERT-Large output
  d_model: 768                # Increased capacity
  num_layers: 12              # Deeper reasoning
  num_heads: 12
  d_ff: 3072                  # Wider MLP
  output_dim: 24              # 14 Geo + 10 PCA
  dropout: 0.15
  pos_encoding: learnable
  activation: gelu
  mse_weight: 1.0
  pcc_weight: 2.0             # Emphasis on dynamics
  velocity_weight: 1.5
  acceleration_weight: 0.8

# Logging
logging:
  experiment_name: sullivan_a100_v1
  log_dir: logs/training
  save_dir: models/transformer_a100
  log_every_n_steps: 1
