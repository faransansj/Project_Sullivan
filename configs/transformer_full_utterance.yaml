# Transformer Full Utterance Training Configuration
# Uses min-max normalization + variable-length full utterances (20 epochs)

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: mel  # 'mel' or 'mfcc'
  parameter_type: geometric  # 'geometric' or 'pca'
  sequence_length: null  # Use full variable-length utterances (NO SEGMENTATION!)

# Model settings
model:
  name: Transformer
  input_dim: 80  # 80 for mel-spectrogram
  d_model: 128  # Keep small for CPU training
  num_layers: 2  # 2 layers for faster training
  num_heads: 4  # 4 heads
  d_ff: 512  # Feed-forward dimension
  output_dim: 14  # 14 geometric parameters
  dropout: 0.1
  pos_encoding: learnable
  activation: gelu
  learning_rate: 0.0005
  weight_decay: 0.01
  max_seq_len: 5000  # Max sequence length for positional encoding

# Training settings
training:
  batch_size: 4  # Smaller batch for variable-length sequences
  num_epochs: 20  # More epochs for temporal learning
  num_workers: 0
  accumulate_grad_batches: 2  # Effective batch size = 4 * 2 = 8
  gradient_clip_val: 1.0
  precision: 32

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.0005
  weight_decay: 0.01
  betas: [0.9, 0.98]
  lr_scheduler: CosineAnnealingWarmRestarts
  lr_scheduler_params:
    T_0: 10  # Restart every 10 epochs
    T_mult: 2
    eta_min: 0.000001

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 10  # Early stop if no improvement for 10 epochs
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 3  # Save top 3 models
    save_last: true
    filename: "transformer-full-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: transformer_full_utterance
  log_dir: logs/training
  save_dir: models/transformer_full_utterance
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 5

# Reproducibility
seed: 42

# Hardware
device: cpu
