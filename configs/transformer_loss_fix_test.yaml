# Transformer Loss Fix Test Configuration
# For testing the fixed loss masking (5 epochs only)

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: mel  # 'mel' or 'mfcc'
  parameter_type: geometric  # 'geometric' or 'pca'
  sequence_length: 500  # Split into 500-frame sequences

# Model settings
model:
  name: Transformer
  input_dim: 80  # 80 for mel-spectrogram
  d_model: 128  # Small for quick test
  num_layers: 2  # Fewer layers for quick test
  num_heads: 4  # Fewer heads for quick test
  d_ff: 512  # Smaller FFN
  output_dim: 14  # 14 geometric parameters
  dropout: 0.1
  pos_encoding: learnable
  activation: gelu
  learning_rate: 0.0005
  weight_decay: 0.01
  max_seq_len: 5000

# Training settings
training:
  batch_size: 8
  num_epochs: 5  # Quick 5-epoch test
  num_workers: 0
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  precision: 32

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.0005
  weight_decay: 0.01
  betas: [0.9, 0.98]
  lr_scheduler: CosineAnnealingWarmRestarts
  lr_scheduler_params:
    T_0: 5
    T_mult: 2
    eta_min: 0.000001

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 10  # Don't early stop in 5 epochs
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 2
    save_last: true
    filename: "transformer-lossfix-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: transformer_loss_fix_test
  log_dir: logs/training
  save_dir: models/transformer_loss_fix_test
  log_every_n_steps: 5

# Evaluation
evaluation:
  metrics:
    - rmse
    - mae
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 3

# Reproducibility
seed: 42

# Hardware
device: cpu
