# Transformer Phase 4-C Configuration: Staged Curriculum Learning
# Step 1-3: Train PCA Head Only

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: mel
  parameter_type: combined  # Load 24 dims
  sequence_length: 500
  streaming: true

training:
  batch_size: 8
  num_epochs: 30 # Short fine-tuning
  num_workers: 0
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  precision: 32

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.00005  # Extremely fine adjustment
  weight_decay: 0.01
  betas: [0.9, 0.98]
  lr_scheduler: CosineAnnealingWarmRestarts
  lr_scheduler_params:
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-07

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss_pca
    patience: 10
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss_pca
    mode: min
    save_top_k: 1
    save_last: true
    filename: "transformer-stage4C-{epoch:02d}-{val_loss_pca:.4f}"

# Logging
logging:
  experiment_name: transformer_phase4c_curriculum
  log_dir: logs/training
  save_dir: models/transformer_phase4c
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 5

# Reproducibility
seed: 42

# Hardware
device: cpu

# Model parameters
model:
  name: Phase4CTransformer
  input_dim: 80
  d_model: 512
  num_layers: 6
  num_heads: 8
  d_ff: 2048
  output_dim: 24
  dropout: 0.1
  pos_encoding: learnable
  activation: gelu
  learning_rate: 0.00005
  weight_decay: 0.01
  max_seq_len: 5000
  mse_weight: 1.0
  pcc_weight: 2.0  # Aggressively prioritize movement
  velocity_weight: 1.2
  acceleration_weight: 0.5
  phase: "pca_only" # Custom flag for the model
