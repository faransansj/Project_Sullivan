# Transformer Phase 4-D Configuration: Joint Fine-Tuning
# Step 4: Unfreeze All, Low LR

# Data settings
data:
  splits_dir: data/processed/splits
  audio_feature_dir: data/processed/audio_features
  parameter_dir: data/processed/parameters
  audio_feature_type: mel
  parameter_type: combined  # 24 dims
  sequence_length: 500
  streaming: true

training:
  batch_size: 8
  num_epochs: 20 # Short polishing
  num_workers: 0
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  precision: 32

# Optimization
optimization:
  optimizer: AdamW
  learning_rate: 0.000001  # 1e-6 (Very Low)
  weight_decay: 0.01
  betas: [0.9, 0.98]
  lr_scheduler: CosineAnnealingWarmRestarts
  lr_scheduler_params:
    T_0: 10
    T_mult: 2
    eta_min: 1.0e-08

# Callbacks
callbacks:
  early_stopping:
    monitor: val_loss
    patience: 5
    mode: min
    verbose: true
  model_checkpoint:
    monitor: val_loss
    mode: min
    save_top_k: 1
    save_last: true
    filename: "transformer-stage4D-{epoch:02d}-{val_loss:.4f}"

# Logging
logging:
  experiment_name: transformer_phase4d_joint
  log_dir: logs/training
  save_dir: models/transformer_phase4d
  log_every_n_steps: 10

# Evaluation
evaluation:
  metrics:
    - rmse
    - pearson_correlation
  visualize_predictions: true
  num_samples_to_visualize: 5

# Reproducibility
seed: 42

# Hardware
device: cpu

# Model parameters
model:
  name: Transformer
  input_dim: 80
  d_model: 512
  num_layers: 6
  num_heads: 8
  d_ff: 2048
  output_dim: 24
  dropout: 0.1
  pos_encoding: learnable
  activation: gelu
  learning_rate: 0.000001 # 1e-6
  weight_decay: 0.01
  max_seq_len: 5000
  mse_weight: 1.0 # Balanced
  pcc_weight: 1.0 # Balanced
  velocity_weight: 1.2
  acceleration_weight: 0.5
